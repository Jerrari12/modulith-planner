name: Deploy to GitHub Pages

# Publishes the app to GitHub Pages on every push to main. Ported from the viewer
# repo's workflow on 2026-10-12 when this repo was seeded from it: the app now
# lives at the repo root (not viewer/), the part GLBs and thumbnails come from
# Jerrari12/gen2-parts (checked out below so the pool-reading tests can run),
# and the adhesive-foot derivation check stayed behind with the GLB Pipeline,
# which this repo does not carry. Only the served folders are uploaded.

on:
  push:
    branches: [main]
    # ⚠ DOCUMENTATION-ONLY PUSHES RUN NOTHING (2026-10-25). A push whose every changed file is under docs/ or is a
    # Markdown file at the repo root changes nothing that is served or tested: Assemble the site copies only the served
    # folders, and no test reads docs/ or a root .md. Nine of the 28 runs before this (287 of 1155 runner minutes) were
    # DECISIONS.md lines. The list is deliberately NARROW: models, textures, fonts, images, kits, configuration and the
    # README files inside served folders are NOT on it - each can change what a visitor gets, or is published. A push
    # mixing a docs file with anything else runs everything. The deploy job's freshness check reads the SAME two
    # patterns; change them together. workflow_dispatch ignores this filter, so a manual run always tests and deploys.
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ⚠ NO WORKFLOW-LEVEL CONCURRENCY (2026-10-25). Until then the whole run sat in group `pages` with cancel-in-progress, so
# a newer push cancelled an older run at whatever step it had reached - publishing included. Now each TEST job has a
# group of its own per ref (and per shard), so a newer push cancels the older run's testing at once, while the deploy job
# queues in `pages-deploy` WITHOUT cancel-in-progress: a deployment already publishing finishes, and a deploy still
# waiting there is replaced by the newer one (GitHub keeps one pending run per group). An older run whose tests were
# cancelled never deploys (the deploy needs every test job). The deploy's freshness check covers the rest: a re-run of
# an old run, or one whose tests finished just before a newer push, publishes only if main's tip serves the same files.
# Only a run's FIRST attempt cancels (cancel-in-progress is `run_attempt == '1'`): a manual re-run of an older run would
# otherwise cancel a newer run's tests and then fail the freshness check, leaving the newest code unpublished (Sol
# 01a1762e). A re-run waits for the group instead; a newer push still cancels it.
#
# The jobs: unit (npm test), build (the stamping, the module-graph guard, the site artifact - minutes, so a forgotten
# sed line fails fast instead of after the browser suites), browser (smoke, profile-lands, relief-tier), e2e (the end-to-
# end suite in shards, e2e/shard.mjs), e2e-coverage (every case ran exactly once across the shards), deploy (main only).

jobs:
  unit:
    concurrency:
      group: unit-${{ github.ref }}
      cancel-in-progress: ${{ github.run_attempt == '1' }}
    # ubuntu-24.04, not ubuntu-latest: GitHub began moving ubuntu-latest to Ubuntu 26.04 on 2026-10-19 (runner-images
    # issue 14748), and on the 26.04 image this job's browser e2e step runs about twice as slow (33-35 min against 18 on
    # 24.04, the same Chrome for Testing 153 build) and dies on its waits: runs 39429860751 and 39433302069 were 26.04 and
    # failed, 39332085367 and 39335008933 were 24.04 and passed, the code the same. Revisit when the e2e bounds are retuned.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The part pools. parts/ and img/parts/ moved to Jerrari12/gen2-parts on
      # 2026-10-12; the tests that open GLBs read them from parts/<length>/, so
      # the pools are checked out beside the app and linked where they used to be.
      - uses: actions/checkout@v4
        with:
          repository: Jerrari12/gen2-parts
          path: _parts
      - name: Link the part pools where the tests read them
        run: |
          ln -s "$PWD/_parts/parts" parts
          ln -s "$PWD/_parts/img/parts" img/parts

      # ⚠ THE GATE. Pushing main IS a deploy, and until 2026-08-22 this workflow
      # ran no tests at all - checkout, stamp, upload, live. Every protection in
      # the repo was therefore local-only and optional, which is the same as
      # absent on the one path that reaches users. The suite is bare `node
      # --test` with zero dependencies, so it costs a node setup and ~1s.
      # It runs BEFORE the sed stamping below, so it judges pristine sources.
      # Of particular note: test/adhesive-foot.test.mjs is what stops a stale
      # DERIVED asset shipping. Adhesive-Foot.lib.glb is cut from the printed
      # foot by GLB Pipeline/derive_adhesive_foot.py, so re-exporting the master
      # silently leaves the derivative wrong - both files still load, both still
      # look like feet. The test pins both md5s, the semantic tie between them
      # (same footprint, exactly 3.00mm shorter) and byte-identity across all
      # six collection pools.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test (blocks the deploy)
        run: npm test

  build:
    # the stamped site, built beside the tests and uploaded as this run's Pages artifact; only the deploy job publishes it
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: ${{ github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Stamp the app's own JS/CSS URLs with the commit SHA. GitHub Pages caches
      # assets for 10 minutes (max-age=600), so without this a visitor loading
      # right after a deploy can get NEW index.html + STALE main.js (or css) and
      # the viewer dies at boot ("Loading parts…" forever). Versioned URLs make
      # every deploy atomic. Local dev is untouched (stamping happens only here).
      # ⚠ EVERY module main.js imports must be stamped here, not just the first
      # one. entry.js was added 2026-08-22 and stamping it is not optional: an
      # unstamped sibling is cached independently of its stamped importer, which
      # is precisely the NEW-index/STALE-module split this step exists to stop -
      # and entry.js decides which kit the front door opens, so a stale copy
      # would route boots by yesterday's rules. If you add an import to main.js,
      # add a line here; the guard below fails the deploy if you forget.
      - name: Cache-proof asset URLs
        run: |
          V="${GITHUB_SHA::8}"
          # index.html loads js/boot.js (phase 0, 2026-10-12), which imports main.js: one stamp per hop
          sed -i "s|css/viewer.css|css/viewer.css?v=$V|; s|js/boot.js|js/boot.js?v=$V|" index.html
          sed -i "s|'./app.js'|'./app.js?v=$V'|" js/boot.js
          sed -i "s|'./main.js'|'./main.js?v=$V'|; s|'./workspaces/build.js'|'./workspaces/build.js?v=$V'|; s|'./workspaces/assemble.js'|'./workspaces/assemble.js?v=$V'|; s|'./workspaces/parts.js'|'./workspaces/parts.js?v=$V'|; s|'./state/store.js'|'./state/store.js?v=$V'|; s|'./workspaces/colors.js'|'./workspaces/colors.js?v=$V'|; s|'./ui/phone.js'|'./ui/phone.js?v=$V'|; s|'./workspaces/labels.js'|'./workspaces/labels.js?v=$V'|; s|'./state/builds.js'|'./state/builds.js?v=$V'|; s|'./ui/setup.js'|'./ui/setup.js?v=$V'|; s|'./state/label-copies.js'|'./state/label-copies.js?v=$V'|; s|'./rules/stand.js'|'./rules/stand.js?v=$V'|" js/app.js
          sed -i "s|'./dom.js'|'./dom.js?v=$V'|; s|'./icons.js'|'./icons.js?v=$V'|; s|'../rules/layout.js'|'../rules/layout.js?v=$V'|; s|'../rules/stand.js'|'../rules/stand.js?v=$V'|; s|'../rules/schema.js'|'../rules/schema.js?v=$V'|; s|'../generate.js'|'../generate.js?v=$V'|" js/ui/setup.js
          sed -i "s|'./layout.js'|'./layout.js?v=$V'|" js/rules/stand.js   # the hand-written structure helpers (2026-10-20)
          sed -i "s|'../rules/settle.js'|'../rules/settle.js?v=$V'|" js/workspaces/build.js js/ui/setup.js   # the settle rule (2026-10-25)
          sed -i "s|'../rules/schema.js'|'../rules/schema.js?v=$V'|" js/state/builds.js
          sed -i "s|'./dom.js'|'./dom.js?v=$V'|; s|'./icons.js'|'./icons.js?v=$V'|; s|'./topbar.js'|'./topbar.js?v=$V'|" js/ui/phone.js
          sed -i "s|'../ui/phone.js'|'../ui/phone.js?v=$V'|" js/workspaces/build.js js/workspaces/colors.js js/workspaces/parts.js js/workspaces/assemble.js js/workspaces/labels.js
          # the hover hints on every workspace (2026-10-23): hint.js was labels.js's alone (its line below); the clips under
          # img/hints/ are plain assets, loaded by URL, and need no stamp
          sed -i "s|'../ui/hint.js'|'../ui/hint.js?v=$V'|" js/workspaces/build.js js/workspaces/colors.js js/workspaces/parts.js js/workspaces/assemble.js
          # the Labels workspace (phase 5) and its rules module
          sed -i "s|'../ui/icons.js'|'../ui/icons.js?v=$V'|; s|'../ui/dom.js'|'../ui/dom.js?v=$V'|; s|'../ui/topbar.js'|'../ui/topbar.js?v=$V'|; s|'../ui/toolbar.js'|'../ui/toolbar.js?v=$V'|; s|'../generate.js'|'../generate.js?v=$V'|; s|'../rules/labels.js'|'../rules/labels.js?v=$V'|; s|'../label-panel.js'|'../label-panel.js?v=$V'|; s|'../label-text.js'|'../label-text.js?v=$V'|; s|'../ui/hint.js'|'../ui/hint.js?v=$V'|" js/workspaces/labels.js
          sed -i "s|'./dom.js'|'./dom.js?v=$V'|" js/ui/hint.js
          sed -i "s|'../label-panel.js'|'../label-panel.js?v=$V'|" js/rules/labels.js
          # the Label plate (step B1): its rules module, imported by the Labels workspace and importing the label rules
          sed -i "s|'../rules/plate.js'|'../rules/plate.js?v=$V'|" js/workspaces/labels.js
          # the faceplate tiles in its no-label-faceplate callout (2026-10-27): the Build library's glyphs
          sed -i "s|'../ui/glyph.js'|'../ui/glyph.js?v=$V'|" js/workspaces/labels.js
          sed -i "s|'./labels.js'|'./labels.js?v=$V'|" js/rules/plate.js
          sed -i "s|'../ui/icons.js'|'../ui/icons.js?v=$V'|; s|'../ui/dom.js'|'../ui/dom.js?v=$V'|; s|'../ui/topbar.js'|'../ui/topbar.js?v=$V'|; s|'../ui/toolbar.js'|'../ui/toolbar.js?v=$V'|; s|'../filament-db.js'|'../filament-db.js?v=$V'|; s|'../bed-finish.js'|'../bed-finish.js?v=$V'|" js/workspaces/colors.js
          # the Colors plan's step 5 / 5b (2026-10-18): the look generator, its styles, colour words and maths, the owned list
          sed -i "s|'../colors/surprise.js'|'../colors/surprise.js?v=$V'|; s|'../colors/styles.js'|'../colors/styles.js?v=$V'|; s|'../state/owned.js'|'../state/owned.js?v=$V'|" js/workspaces/colors.js
          sed -i "s|'../filament-db.js'|'../filament-db.js?v=$V'|; s|'./colour.js'|'./colour.js?v=$V'|; s|'./styles.js'|'./styles.js?v=$V'|; s|'./words.js'|'./words.js?v=$V'|" js/colors/surprise.js
          sed -i "s|'./colour.js'|'./colour.js?v=$V'|" js/colors/words.js
          # step 6 (2026-10-18): Simplify and the summary, imported by the Colors workspace
          sed -i "s|'../colors/simplify.js'|'../colors/simplify.js?v=$V'|" js/workspaces/colors.js
          sed -i "s|'./colour.js'|'./colour.js?v=$V'|; s|'./surprise.js'|'./surprise.js?v=$V'|" js/colors/simplify.js
          # the material chips (2026-10-23): the picker's material filter, imported by the Colors workspace (it imports nothing itself)
          sed -i "s|'../colors/materials.js'|'../colors/materials.js?v=$V'|" js/workspaces/colors.js
          sed -i "s|'../rules/layout.js'|'../rules/layout.js?v=$V'|; s|'../rules/schema.js'|'../rules/schema.js?v=$V'|" js/state/store.js
          sed -i "s|'../ui/icons.js'|'../ui/icons.js?v=$V'|; s|'../ui/dom.js'|'../ui/dom.js?v=$V'|; s|'../ui/topbar.js'|'../ui/topbar.js?v=$V'|; s|'../ui/toolbar.js'|'../ui/toolbar.js?v=$V'|; s|'../ui/glyph.js'|'../ui/glyph.js?v=$V'|; s|'../rules/bom.js'|'../rules/bom.js?v=$V'|; s|'../rules/layout.js'|'../rules/layout.js?v=$V'|" js/workspaces/parts.js
          # the Parts list names the filament a part prints in (2026-10-18): it reads the Colors tab's words from its module
          sed -i "s|'./colors.js'|'./colors.js?v=$V'|" js/workspaces/parts.js
          # the rows' part renders (2026-10-27) come from the parts host by config.js's assetUrl - the same stamped URL as
          # main.js's import, so one instance
          sed -i "s|'../config.js'|'../config.js?v=$V'|" js/workspaces/parts.js
          sed -i "s|'../ui/icons.js'|'../ui/icons.js?v=$V'|; s|'../ui/dom.js'|'../ui/dom.js?v=$V'|; s|'../ui/topbar.js'|'../ui/topbar.js?v=$V'|; s|'../ui/toolbar.js'|'../ui/toolbar.js?v=$V'|" js/workspaces/assemble.js
          # the Done scene (2026-10-23): assemble.js imports it on demand, so its import() is stamped like a static one; the
          # module's own helper and the room assets it fetches (scenes/) are stamped inside it
          sed -i "s|'../scenes/done.js'|'../scenes/done.js?v=$V'|" js/workspaces/assemble.js js/workspaces/colors.js   # Colors imports it too (the Studio / Room toggle)
          sed -i "s|'./done-fit.js'|'./done-fit.js?v=$V'|; s|'./spool.js'|'./spool.js?v=$V'|; s|'scenes/home-office/room.glb'|'scenes/home-office/room.glb?v=$V'|; s|'scenes/home-office/room.json'|'scenes/home-office/room.json?v=$V'|" js/scenes/done.js
          sed -i "s|'./dom.js'|'./dom.js?v=$V'|; s|'./icons.js'|'./icons.js?v=$V'|" js/ui/toolbar.js
          sed -i "s|'../ui/glyph.js'|'../ui/glyph.js?v=$V'|; s|'../ui/icons.js'|'../ui/icons.js?v=$V'|; s|'../ui/dom.js'|'../ui/dom.js?v=$V'|; s|'../ui/topbar.js'|'../ui/topbar.js?v=$V'|; s|'../ui/toolbar.js'|'../ui/toolbar.js?v=$V'|; s|'../ui/board.js'|'../ui/board.js?v=$V'|; s|'../rules/layout.js'|'../rules/layout.js?v=$V'|; s|'../rules/schema.js'|'../rules/schema.js?v=$V'|; s|'../generate.js'|'../generate.js?v=$V'|; s|'../rules/stand.js'|'../rules/stand.js?v=$V'|" js/workspaces/build.js
          sed -i "s|'./dom.js'|'./dom.js?v=$V'|" js/ui/board.js
          sed -i "s|'./dom.js'|'./dom.js?v=$V'|; s|'./icons.js'|'./icons.js?v=$V'|; s|'./names.js'|'./names.js?v=$V'|" js/ui/topbar.js
          # the shown names (2026-10-16): imported by app.js, the top bar and the Parts workspace
          sed -i "s|'./ui/names.js'|'./ui/names.js?v=$V'|" js/app.js js/main.js   # main.js imports it too since 2026-10-19 (the viewer's tab title)
          # the front door (cutover, 2026-10-17): app.js asks entry.js which workspace a bare address opens; main.js
          # imports it too (its own line below), one sed target per importer
          sed -i "s|'./entry.js'|'./entry.js?v=$V'|" js/app.js
          sed -i "s|'../ui/names.js'|'../ui/names.js?v=$V'|" js/workspaces/parts.js js/workspaces/build.js
          sed -i "s|js/catalog/data.js|js/catalog/data.js?v=$V|; s|css/tokens.css|css/tokens.css?v=$V|; s|css/app.css|css/app.css?v=$V|; s|css/fonts.css|css/fonts.css?v=$V|" index.html
          # ⚠ the vendored requirement-scope contract is a CLASSIC script tag,
          # not a module import, so the module-graph guard below cannot see it.
          # It still caches independently of index.html, which is the same
          # stale-asset bug in a different shape.
          sed -i "s|js/vendor/requirement-scope.js|js/vendor/requirement-scope.js?v=$V|" index.html
          sed -i "s|js/vendor/tabletop-completion.js|js/vendor/tabletop-completion.js?v=$V|" index.html
          sed -i "s|js/vendor/modulith-feedback.js|js/vendor/modulith-feedback.js?v=$V|" index.html
          # where the part GLBs and thumbnails live (2026-10-12, the gen2-parts split) - a main.js import
          sed -i "s|'./config.js'|'./config.js?v=$V'|" js/main.js
          sed -i "s|'./generate.js'|'./generate.js?v=$V'|" js/main.js
          sed -i "s|'./entry.js'|'./entry.js?v=$V'|" js/main.js
          # relay authentication (2026-10-03): who may drive the viewer, and the planner origin its posts target
          sed -i "s|'./relay-auth.js'|'./relay-auth.js?v=$V'|" js/main.js
          # ⚠ THE TWO CROSS-REPO MODULES. Both landed 2026-09-05 as new imports in main.js and
          # neither got a line here, so the guard below has been failing the deploy ever since -
          # exactly the forgotten-line case the comment above warns about, on the first two files
          # added after it was written.
          sed -i "s|'./filament-db.js'|'./filament-db.js?v=$V'|" js/main.js
          sed -i "s|'./part-material.js'|'./part-material.js?v=$V'|" js/main.js
          # ⚠ The Lab's renderer, and the first module we carry that another repo AUTHORS as an
          # ES module - requirement-scope.js and tabletop-completion.js are classic script tags,
          # stamped against index.html above. This one is a real import and needs a real line.
          sed -i "s|'./vendor/layer-detail.js'|'./vendor/layer-detail.js?v=$V'|" js/main.js
          # Very High's thin lens (2026-10-24, the Done scene's bokeh): main.js imports it, and so does the scene's arithmetic
          sed -i "s|'./lens.js'|'./lens.js?v=$V'|" js/main.js
          sed -i "s|'../lens.js'|'../lens.js?v=$V'|" js/scenes/done-fit.js
          # ⚠ THE FIRST SPECIFIER THAT IS NOT IN main.js. filament-profiles.js is the Lab's authored
          # per-filament finish, and part-material.js imports it as a SIBLING — so the sed target is
          # part-material.js, not main.js, and a line copied from the block above would silently
          # match nothing. The graph guard below walks every module in js/, so a forgotten
          # line here fails the deploy rather than shipping a module that caches independently of
          # the importer that reads it.
          sed -i "s|'./filament-profiles.js'|'./filament-profiles.js?v=$V'|" js/part-material.js
          # and the catalog, since the silk approximation (2026-10-28): part-material.js reads a label's finish family
          sed -i "s|'./filament-db.js'|'./filament-db.js?v=$V'|" js/part-material.js
          # the silk parts' sheen frame and silk light (2026-10-28) - a main.js import
          sed -i "s|'./silk-axis.js'|'./silk-axis.js?v=$V'|" js/main.js
          # the build plate's bed-surface finish (2026-09-14) - a main.js import like the rest
          sed -i "s|'./bed-finish.js'|'./bed-finish.js?v=$V'|" js/main.js
          # the cover tiles' shading-only edge (2026-10-21) - a main.js import too
          sed -i "s|'./cover-seam.js'|'./cover-seam.js?v=$V'|" js/main.js
          # the baked top layers (2026-10-25) - a main.js import too; the maps under parts/skin/ are part assets on the parts host
          sed -i "s|'./skin-map.js'|'./skin-map.js?v=$V'|" js/main.js
          # the dimension labels' cover test (2026-09-14, the moving-frame savings) - a main.js import too
          sed -i "s|'./dim-cover.js'|'./dim-cover.js?v=$V'|" js/main.js
          # the orbit benchmark, ?bench=orbit (2026-09-14) - a main.js import (the version its results report is main.js's
          # own ?v= stamp from index.html above, read through import.meta.url)
          sed -i "s|'./orbit-bench.js'|'./orbit-bench.js?v=$V'|" js/main.js
          # the settle benchmark, ?bench=settle (2026-09-16) - a main.js import, and it imports orbit-bench.js itself
          sed -i "s|'./settle-bench.js'|'./settle-bench.js?v=$V'|" js/main.js
          # the see-into translucent filament experiment (2026-09-17) - a main.js import, off unless ?seeinto= asks
          sed -i "s|'./see-into.js'|'./see-into.js?v=$V'|" js/main.js
          # each drawer's planner label drawn on its EdgeLabel label (2026-10-01) - a main.js import; it loads its vendored
          # opentype.js and font itself, by URL relative to import.meta.url, and only when a build has label text
          sed -i "s|'./label-text.js'|'./label-text.js?v=$V'|" js/main.js
          # what a label may carry besides its words (2026-10-02) - imported by label-text.js, and since the label panel
          # (step 2) by main.js and label-panel.js as well: three sed targets, one per importer (the filament-profiles.js case)
          sed -i "s|'./label-spec.js'|'./label-spec.js?v=$V'|" js/label-text.js
          sed -i "s|'./label-spec.js'|'./label-spec.js?v=$V'|" js/main.js
          sed -i "s|'./label-spec.js'|'./label-spec.js?v=$V'|" js/label-panel.js
          # the label panel's pure parts (label plan step 2) - a main.js import, and since the label icons (7a310a8,
          # isLabelSvg) a label-text.js import too: one sed target per importer
          sed -i "s|'./label-panel.js'|'./label-panel.js?v=$V'|" js/main.js
          sed -i "s|'./label-panel.js'|'./label-panel.js?v=$V'|" js/label-text.js
          # which drawer wears a part label or a colour stripe (2026-10-10) - a main.js import, and it imports label-spec.js
          sed -i "s|'./label-look.js'|'./label-look.js?v=$V'|" js/main.js
          sed -i "s|'./label-spec.js'|'./label-spec.js?v=$V'|" js/label-look.js
          # the panel's drawn label previews (2026-10-17): labels.js imports label-look.js and label-preview.js, and
          # label-preview.js imports label-text.js - stamped like main.js's, so all three share ONE label-text.js instance
          sed -i "s|'../label-look.js'|'../label-look.js?v=$V'|; s|'../label-preview.js'|'../label-preview.js?v=$V'|" js/workspaces/labels.js
          sed -i "s|'./label-text.js'|'./label-text.js?v=$V'|" js/label-preview.js
          # the label palette (2026-10-28): imported by main.js, app.js and labels.js; it imports label-look.js, the catalog,
          # the colour maths and the schema (its record cleaner); labels.js reads the owned list, colors.js the stripe words
          sed -i "s|'./label-palette.js'|'./label-palette.js?v=$V'|" js/main.js js/app.js
          sed -i "s|'./rules/schema.js'|'./rules/schema.js?v=$V'|" js/app.js   # a shared build's look, cleaned at the boot (2026-10-28)
          sed -i "s|'../label-palette.js'|'../label-palette.js?v=$V'|; s|'../state/owned.js'|'../state/owned.js?v=$V'|" js/workspaces/labels.js
          sed -i "s|'./label-look.js'|'./label-look.js?v=$V'|; s|'./filament-db.js'|'./filament-db.js?v=$V'|; s|'./colors/colour.js'|'./colors/colour.js?v=$V'|; s|'./rules/schema.js'|'./rules/schema.js?v=$V'|" js/label-palette.js
          sed -i "s|'../label-look.js'|'../label-look.js?v=$V'|" js/workspaces/colors.js
          # ⚠ The Label Studio's part-label files (js/vendor/label-hardware.js, hardware-layout.js, hardware-data.js,
          # hardware-v5-data.js, hardware-band-data.js, and Classic Pro's hardware-data-classicpro.js and classicpro-core.js) need NO line here: like the core and the icon catalog they are CLASSIC
          # scripts label-text.js loads itself (vendorUrl), by URL relative to its import.meta.url and carrying ITS OWN ?v=
          # stamp - so the line stamping './label-text.js' in main.js above stamps all five, loaded only when a build has a
          # part label or a colour stripe.
          sed -i "s|'./orbit-bench.js'|'./orbit-bench.js?v=$V'|" js/settle-bench.js

      # Fail the deploy rather than ship a half-stamped module graph. A first
      # version of this guard was a single grep over main.js for
      #   ^import .* from './name.js'
      # which missed every other form that produces the same stale-module bug:
      # side-effect imports, double quotes, subdirectories, indented or
      # multi-line imports, `export ... from`, dynamic import(), and - most
      # importantly - imports inside the OTHER local modules. A freshly stamped
      # entry.js that imports an unstamped helper.js recreates the exact
      # mismatch the stamping exists to prevent.
      # So: scan EVERY local module and flag any relative specifier without ?v=.
      - name: Verify the whole module graph is stamped
        run: |
          node - <<'NODE'
          const fs = require('fs'), path = require('path');
          const dir = 'js';
          // every relative specifier, whatever syntax introduced it
          const SPEC = /(?:\bfrom\s*|\bimport\s*\(?\s*|\bexport\s+\*\s+from\s*)(['"])(\.[^'"]*)\1/g;
          let bad = [];
          // walk js/ AND its subdirectories - vendored code lives in js/vendor/
          const walk = (d) => fs.readdirSync(d, { withFileTypes: true }).flatMap(e =>
            e.isDirectory() ? walk(path.join(d, e.name)) : [path.join(d, e.name)]);
          for (const f of walk(dir).filter(n => n.endsWith('.js'))) {
            const src = fs.readFileSync(f, 'utf8');
            for (const m of src.matchAll(SPEC)) {
              const spec = m[2];
              if (!spec.endsWith('.js') && !spec.includes('.js?')) continue; // not a module path
              if (!/[?&]v=/.test(spec)) bad.push(`${f} -> ${spec}`);
            }
          }
          /* ⚠ AND the CLASSIC <script src> tags in index.html. A module-graph
             walk cannot see them, and the vendored requirement-scope contract
             is exactly that shape - it caches independently of index.html, so
             an unstamped one ships the same stale-asset failure by another
             route. Absolute URLs (the analytics beacon) are not ours to stamp. */
          const html = fs.readFileSync('index.html', 'utf8');
          for (const m of html.matchAll(/<script[^>]*\ssrc="([^"]+)"/g)) {
            const src = m[1];
            if (/^https?:\/\/|^\/\//.test(src)) continue;   // third-party, not cache-stamped by us
            if (!/[?&]v=/.test(src)) bad.push(`index.html -> <script src="${src}">`);
          }
          if (bad.length) {
            for (const b of bad) console.log('::error::UNSTAMPED module import: ' + b);
            console.log('::error::Add a sed line for it above. An unstamped module can be served');
            console.log('::error::from cache against a freshly deployed importer, which is the');
            console.log('::error::"new index.html + stale module" boot failure this step prevents.');
            process.exit(1);
          }
          console.log('module graph OK: every relative import is version-stamped');
          NODE
      # Only the served folders go up: not node_modules, the tests, the docs or the
      # linked part pools (those are served by gen2-parts' own Pages site).
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html css js img icons fonts kits builds scenes stats vendor favicon.ico favicon.svg apple-touch-icon.png part-preview-support.json _site/
          rm -f _site/img/parts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  browser:
    concurrency:
      group: browser-${{ github.ref }}
      cancel-in-progress: ${{ github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The part pools. parts/ and img/parts/ moved to Jerrari12/gen2-parts on
      # 2026-10-12; the tests that open GLBs read them from parts/<length>/, so
      # the pools are checked out beside the app and linked where they used to be.
      - uses: actions/checkout@v4
        with:
          repository: Jerrari12/gen2-parts
          path: _parts
      - name: Link the part pools where the tests read them
        run: |
          ln -s "$PWD/_parts/parts" parts
          ln -s "$PWD/_parts/img/parts" img/parts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the browser-test dependencies
        run: npm ci --no-audit --no-fund
      # ⚠ THE BROWSER IS THE IMAGE'S OWN CHROME (2026-10-25). Every browser suite launches Google Chrome from the runner
      # image first (channel chrome) and Playwright's Chromium only if that fails; the baseline run 40257169401 launched
      # "channel chrome 155.0.8059.39", so `npx playwright install --with-deps chromium` - 4.78 min a job - fetched a
      # browser nobody opened. It now runs only when the image's Chrome does not launch (tools/ci-browser.mjs), which
      # keeps the old fallback instead of failing; either way a notice names the browser the suites got.
      - name: Check the browser (install Playwright's Chromium only if the image's Chrome does not launch)
        run: |
          node tools/ci-browser.mjs || { npx playwright install --with-deps chromium && node tools/ci-browser.mjs --any; }
      # ⚠ THE SUITE ABOVE CANNOT SEE A PIXEL. It runs without a browser, so it passes on a build
      # whose viewer throws at boot and shows a black canvas forever — every protection in this
      # repo was blind to the one failure a visitor actually experiences. This opens the two routes
      # that reach users in a real headless Chrome and asserts they draw: no console errors, a
      # canvas that is neither black nor a flat fill, and the two cross-repo modules loaded and
      # doing their job. Mutation-checked both ways before it landed — a planted boot throw fails
      # all three routes on console noise, and the layer-detail kill switch fails the module check
      # alone while the picture stays fine.
      # It is the only step here that needs node_modules, which is why the suite above still does
      # not, and why this is a separate step rather than folded into npm test.
      #
      # profile-lands is the second half and answers a different question: the unit tests prove
      # partMaterialSpec RETURNS the authored finish, which says nothing about whether anything on
      # screen wears it. Three things sit between the spec and the picture - activeLabel finding the
      # label, newPartMaterial passing it, and applyPalette carrying the FINISH and not only the
      # colour - and the third was missing until it was written. It drives the picker's own sequence
      # with no rebuild, and is mutation-checked: reverting applyPalette to colour-only fails it.
      #
      # relief-tier is the third and guards a number. The printed relief is a per-fragment cost that
      # the quality ladder did not reach, so `fast` - the tier a struggling device settles on - paid
      # it in full while paying for nothing else: measured at 0.452x the deployed frame rate on a
      # software rasteriser, against 0.739x at `high`. Putting relief on the ladder took `fast` back
      # to 0.973x. The test asserts the material a mesh is WEARING carries no layer program at fast
      # and does at high, because a flag only the next rebuild would honour saves nothing on the
      # materials a struggling device already has. Mutation-checked: dropping the rebuild from
      # applyQuality fails it.
      # A failure names itself in the run's annotations (tools/ci-named.sh), and each suite's slowest cases are a notice.
      - name: Smoke test the deployed routes in a browser (blocks the deploy)
        run: bash tools/ci-named.sh smoke
      - name: Profile lands (blocks the deploy)
        run: bash tools/ci-named.sh profile-lands
      - name: Relief tier (blocks the deploy)
        run: bash tools/ci-named.sh relief-tier

  e2e:
    # the merged planner's five workspaces, the store and the setup sheet, driven end to end (2026-10-13), split across
    # runners by e2e/shard.mjs (2026-10-25): each shard runs a share balanced by e2e/shard-weights.json, every case in
    # exactly one shard, and writes what it ran for the coverage job below. Every shard runs to the end (no fail-fast), so
    # one red run names every failing case, as the serial step did. The shard count is the matrix's length.
    # SIX, not four (2026-10-26): on run 40262875906 the four shards carried equal weighted loads (486 s each by the
    # weights) and took 7.5 / 12.7 / 16.9 / 16.3 min, their runner/local medians 0.98 / 1.49 / 1.76 / 1.86 - the spread is
    # the runner machines, which no weighting can fix, so the run waits on its slowest machine; smaller shards bound that.
    # Six on run 40264684655: 5.4 / 8.5 / 10.2 / 10.7 / 5.1 / 5.1 min, the whole run 11.4 min (four: 17.8).
    # EIGHT (2026-10-27, Joey: "why does it take so long?"): the suite had grown to 128 cases and runs took 20-21 min, the
    # slowest shard 20.8 min (run 40616559063: 15.2 / 12.8 / 20.8 / 16.2 / 16.0 / 5.7). Modelled on that day's three green
    # runs with each shard's measured machine speed: the runner's own weights alone 15.8-16.8 min, eight shards 11.9-12.6.
    # The repository is public, so the two extra runners cost nothing.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    name: e2e (shard ${{ matrix.shard }})
    concurrency:
      group: e2e-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: ${{ github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The part pools. parts/ and img/parts/ moved to Jerrari12/gen2-parts on
      # 2026-10-12; the tests that open GLBs read them from parts/<length>/, so
      # the pools are checked out beside the app and linked where they used to be.
      - uses: actions/checkout@v4
        with:
          repository: Jerrari12/gen2-parts
          path: _parts
      - name: Link the part pools where the tests read them
        run: |
          ln -s "$PWD/_parts/parts" parts
          ln -s "$PWD/_parts/img/parts" img/parts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the browser-test dependencies
        run: npm ci --no-audit --no-fund
      # ⚠ THE BROWSER IS THE IMAGE'S OWN CHROME (2026-10-25). Every browser suite launches Google Chrome from the runner
      # image first (channel chrome) and Playwright's Chromium only if that fails; the baseline run 40257169401 launched
      # "channel chrome 155.0.8059.39", so `npx playwright install --with-deps chromium` - 4.78 min a job - fetched a
      # browser nobody opened. It now runs only when the image's Chrome does not launch (tools/ci-browser.mjs), which
      # keeps the old fallback instead of failing; either way a notice names the browser the suites got.
      - name: Check the browser (install Playwright's Chromium only if the image's Chrome does not launch)
        run: |
          node tools/ci-browser.mjs || { npx playwright install --with-deps chromium && node tools/ci-browser.mjs --any; }
      - name: End-to-end workspaces, this shard (blocks the deploy)
        env:
          E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          E2E_SHARD_REPORT: ${{ runner.temp }}/e2e-shard-${{ matrix.shard }}.json
        run: bash tools/ci-named.sh e2e
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-shard-${{ matrix.shard }}.json
          retention-days: 7

  e2e-coverage:
    # the shards together: the same case list in each, and every case run by exactly one (tools/e2e-shard-gate.mjs)
    needs: e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-shard-*
          path: shard-reports
      - name: Every e2e case ran in exactly one shard (blocks the deploy)
        run: node tools/e2e-shard-gate.mjs shard-reports

  deploy:
    # main's alone, and only when EVERY test job passed: unit, browser, all the e2e shards and their coverage
    needs: [unit, build, browser, e2e, e2e-coverage]
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ⚠ AN OLDER BUILD NEVER PUBLISHES OVER A NEWER ONE. If main has moved past this run, publish only when main's tip
      # differs from this commit in documentation alone (the push filter's two patterns, which start no run of their
      # own); otherwise the newer push's run is the one that tests and publishes, and this one stops here.
      - name: Publish only the newest code
        id: fresh
        run: |
          git fetch -q origin main
          tip=$(git rev-parse FETCH_HEAD)
          if [ "$tip" != "$GITHUB_SHA" ] && ! git diff --quiet "$GITHUB_SHA" "$tip" -- . ':(exclude,glob)docs/**' ':(exclude,glob)*.md'; then
            echo "::notice title=deploy skipped::main is at ${tip::8}, whose served files differ from this run's ${GITHUB_SHA::8}; that push's run publishes"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "main is at ${tip::8}; this run (${GITHUB_SHA::8}) serves the same files: publishing"
          fi
      - id: deployment
        if: steps.fresh.outputs.skip != '1'
        uses: actions/deploy-pages@v4
